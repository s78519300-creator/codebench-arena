[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codebench-arena"
version = "0.1.0"
description = "Benchmark LLM-written code with hidden tests, static analysis, auditable rubrics and task calibration."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Shalu Kumari"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
codebench = "codebench_arena.cli:main"

[tool.setuptools]
packages = ["codebench_arena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
